<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bedrock Loom · 模组管理器（离线）</title>
<style>
:root{
  --bg:#0d1117; --panel:#151b24; --panel2:#1b2330; --line:#28313f; --text:#e6edf5;
  --muted:#8b98a9; --accent:#4da3ff; --accent2:#7c5cff; --ok:#3fb950; --warn:#d29922;
  --bad:#f85149; --candidate:#a371f7; --chip:#202b3a; --radius:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:236px 1fr;grid-template-rows:64px 1fr;min-height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 22px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:.3px}
.logo{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:15px;color:#fff}
.badge{padding:2px 8px;border:1px solid var(--line);border-radius:999px;font-size:11px;color:var(--muted)}
.hdr-stats{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.hdr-stats .badge b{color:var(--text)}
nav{border-right:1px solid var(--line);background:var(--panel);padding:14px 10px;overflow:auto}
nav .group{font-size:11px;color:var(--muted);letter-spacing:1px;padding:12px 10px 6px;text-transform:uppercase}
nav button{display:flex;width:100%;align-items:center;gap:9px;text-align:left;background:transparent;border:0;border-radius:8px;padding:9px 11px;color:var(--muted);margin-bottom:2px}
nav button:hover{background:var(--panel2);color:var(--text)}
nav button.active{background:var(--chip);color:var(--text);box-shadow:inset 2px 0 var(--accent)}
nav button .ico{width:18px;text-align:center;font-size:14px}
main{padding:24px 28px;overflow:auto;max-width:1400px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:22px 0 10px}
h3{font-size:14px;margin:0 0 8px}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.tag{display:inline-block;padding:2px 8px;border:1px solid var(--line);border-radius:6px;font-size:11px;color:var(--muted);background:var(--chip)}
.st{border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;white-space:nowrap}
.st-installed,.st-builtin{background:rgba(63,185,80,.14);color:var(--ok)}
.st-update-available{background:rgba(77,163,255,.14);color:var(--accent)}
.st-disabled{background:rgba(139,152,169,.14);color:var(--muted)}
.st-corrupt,.st-incompatible,.st-blocked{background:rgba(248,81,73,.14);color:var(--bad)}
.st-external{background:rgba(163,113,247,.14);color:var(--candidate)}
.btn{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:8px 14px;color:var(--text)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:linear-gradient(135deg,#2b6fd6,#5a44d6);border-color:transparent;color:#fff;font-weight:600}
.btn.danger{background:rgba(248,81,73,.12);border-color:rgba(248,81,73,.4);color:#ff9b95}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:12px}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input[type=text]{min-width:220px;flex:1}
.modcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.thumb{height:88px;background:linear-gradient(135deg,#1b2a44,#2a1b44);display:grid;place-items:center;color:#5b6b84;font-size:11px;border-bottom:1px solid var(--line)}
.modcard .body{padding:13px;display:flex;flex-direction:column;gap:8px;flex:1}
.modcard .name{font-weight:650;font-size:14px}
.modcard .id{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--muted)}
.mods-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
tr:last-child td{border-bottom:0}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:11.5px}
.dim{color:var(--muted)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.acc{color:var(--accent)}
.steps{display:flex;gap:6px;margin:6px 0 18px;flex-wrap:wrap}
.step{flex:1;min-width:120px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px;color:var(--muted)}
.step.on{border-color:var(--accent);color:var(--text);background:rgba(77,163,255,.08)}
.step.done{border-color:var(--ok);color:var(--ok)}
.progress{height:8px;background:var(--bg);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .25s}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:12.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.notice{border-left:3px solid var(--warn);background:rgba(210,153,34,.08);padding:11px 13px;border-radius:0 8px 8px 0;font-size:12.5px;margin:10px 0}
.notice.bad{border-color:var(--bad);background:rgba(248,81,73,.08)}
.notice.ok{border-color:var(--ok);background:rgba(63,185,80,.08)}
.notice.acc{border-color:var(--accent);background:rgba(77,163,255,.08)}
.drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,92vw);background:var(--panel);border-left:1px solid var(--line);z-index:21;transform:translateX(100%);transition:transform .2s;overflow:auto;padding:22px}
.drawer.open{transform:none}
.drawer-mask.open{display:block}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 16px;z-index:40;display:none;box-shadow:0 8px 30px rgba(0,0,0,.4);font-size:12.5px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.app{grid-template-columns:1fr}nav{display:none}.split{grid-template-columns:1fr}}
.pill{font-size:10.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label{font-size:12.5px}
.hint{font-size:11px;color:var(--muted)}
code{background:var(--chip);padding:1px 5px;border-radius:4px;font-size:11.5px}
.risk-high{color:var(--bad);font-weight:600}
.bar{height:6px;background:var(--bg);border-radius:999px;overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:var(--accent)}
.flow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px}
.flow span{background:var(--chip);border:1px solid var(--line);padding:3px 9px;border-radius:6px}
.flow b{color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="logo">BL</span> Bedrock Loom <span class="badge">模组管理器 v2</span></div>
    <span class="badge">国际版 1.21.130</span>
    <span class="badge">离线可用 · 不上传数据</span>
    <div class="hdr-stats">
      <span class="badge">Stable <b>20</b></span>
      <span class="badge">Candidate <b>0</b></span>
      <span class="badge">Experimental <b>20</b></span>
      <span class="badge">Unavailable <b>14</b></span>
    </div>
  </header>
  <nav id="nav"></nav>
  <main id="view"></main>
</div>
<div class="drawer-mask" id="mask" data-action="close-drawer"></div>
<div class="drawer" id="drawer"></div>
<div id="toast"></div>

<script>
/* ---------------------------------------------------------------------------
 * Bedrock Loom 离线图形模组管理器原型
 * 界面层只使用内存数据与契约语义，不直接操作文件系统、不发起网络请求。
 * 权威逻辑与自动化测试见 ../core/*.mjs、../services/*.mjs、../test/*.test.mjs。
 * 本页所有标注"演示数据"的记录均为界面示例，不是真实已安装模组。
 * ------------------------------------------------------------------------- */

const STATES = {
  installed:['已安装','st-installed'], builtin:['内置','st-builtin'],
  external:['外部导入','st-external'], 'update-available':['可更新','st-update-available'],
  disabled:['已禁用','st-disabled'], corrupt:['损坏','st-corrupt'],
  incompatible:['不兼容','st-incompatible'], blocked:['被屏蔽','st-blocked']
};

const MODS = [
  {id:'builtin.core',name:'Bedrock Loom 核心',version:'2.0.0',state:'builtin',author:'Bedrock Loom',license:'MIT',size:184320,category:'核心',tags:['加载器','内置'],source:'official',favorite:false,groups:['系统'],
   perms:['resource.read','presentation.local'],caps:['服务注册发现','事件总线','权限门'],deps:[],conflicts:[],
   contribution:{frameMs:0.4,memoryKb:512,objects:2,errors:0},changelog:'v2 平台侧能力：包格式、签名、依赖、事务、诊断。',releaseDate:'2026-11-06',supported:['1.21.130'],risk:'low'},
  {id:'example.loom_blade',name:'织纹之刃',version:'1.1.0',state:'installed',author:'Bedrock Loom Contributors',license:'MIT',size:92392,category:'装备',tags:['武器','示例','本地表现'],source:'official',favorite:true,groups:['探索'],
   perms:['presentation.local','storage.world','input.local','entity.observe.local'],caps:['静态模型 (R0)','粒子提交 (R1候选)','音效提交','action bar'],
   deps:[{id:'builtin.core',range:'>=2.0.0 <3.0.0'}],conflicts:[],
   contribution:{frameMs:1.2,memoryKb:840,objects:6,errors:0},changelog:'由 v1.1 迁移；新增 capabilities 与阶段合同。',releaseDate:'2026-11-06',supported:['1.21.130'],risk:'low',
   stageContracts:[['ResourceBuild','间接影响','resource_pack/models/entity/*.geo.json + attachables/*'],['SimulationSync','间接影响','Player.spawnParticle / Player.playSound'],['UiDraw','间接影响','ScreenDisplay.setActionBar'],['GeometrySubmit','不可访问','无顶点缓冲提交接口']]},
  {id:'fx.particle_plus',name:'粒子增强包',version:'2.3.0',state:'update-available',author:'Community FX',license:'Apache-2.0',size:245760,category:'视觉',tags:['粒子','特效'],source:'community',favorite:false,groups:['探索'],
   perms:['presentation.local','graphics.settings'],caps:['预定义粒子模板','发射时模板变量 (E2)'],deps:[{id:'builtin.core',range:'>=2.0.0 <3.0.0'}],conflicts:[],
   contribution:{frameMs:2.8,memoryKb:2100,objects:34,errors:1},changelog:'2.4.0 新增大气散射参数（重大更新 + 新增权限）。',releaseDate:'2026-10-20',supported:['1.21.130'],risk:'medium',
   updateTo:{version:'2.4.0',breaking:true,addedPerms:['graphics.settings'],size:268000}},
  {id:'ui.hud_suite',name:'HUD 组件库',version:'1.4.1',state:'installed',author:'UI Works',license:'MIT',size:131072,category:'界面',tags:['HUD','界面'],source:'official',favorite:true,groups:['界面'],
   perms:['ui.screen','input.local'],caps:['action bar / title','HUD 元素可见性','模态表单'],deps:[{id:'builtin.core',range:'>=2.0.0'}],
   conflicts:[{id:'fx.particle_plus',reason:'HUD 插槽 top_right 冲突；两者都声明 service.particle 实现'}],
   contribution:{frameMs:0.9,memoryKb:640,objects:8,errors:0},changelog:'修复 DPI 缩放下的文字裁切。',releaseDate:'2026-09-12',supported:['1.21.130'],risk:'low'},
  {id:'world.map_overlay',name:'地图叠加层',version:'0.9.2',state:'incompatible',author:'Map Lab',license:'GPL-3.0',size:512000,category:'世界',tags:['地图','世界表现'],source:'community',favorite:false,groups:[],
   perms:['world.read.local','network.presentation'],caps:['范围/路径（平台侧数据）'],deps:[{id:'builtin.core',range:'>=3.0.0'}],conflicts:[],
   contribution:{frameMs:0,memoryKb:0,objects:0,errors:0},changelog:'要求加载器 API >=3.0.0，当前 2.0.0。',releaseDate:'2026-08-01',supported:['1.21.120'],risk:'high'},
  {id:'opt.damaged_pack',name:'损坏的材质包',version:'1.0.0',state:'corrupt',author:'Unknown',license:'未声明',size:98304,category:'材质',tags:['材质'],source:'local-file',favorite:false,groups:[],
   perms:['resource.read'],caps:[],deps:[],conflicts:[],
   contribution:{frameMs:0,memoryKb:0,objects:0,errors:3},changelog:'文件清单哈希不匹配；未列文件被拒绝。',releaseDate:'2026-07-11',supported:[],risk:'critical'},
  {id:'net.remote_fx',name:'远端表现桥 (BLSP/1)',version:'1.2.0',state:'disabled',author:'Bridge Team',license:'MIT',size:76800,category:'网络',tags:['可选协议','多人'],source:'private',favorite:false,groups:['联机'],
   perms:['network.presentation','ui.screen'],caps:['表现请求白名单校验'],deps:[{id:'builtin.core',range:'>=2.0.0'}],conflicts:[],
   contribution:{frameMs:0,memoryKb:0,objects:0,errors:0},changelog:'离线单人模式完全不依赖该模块。',releaseDate:'2026-09-30',supported:['1.21.130'],risk:'high'},
  {id:'risk.native_ext',name:'原生扩展示例',version:'0.3.0',state:'blocked',author:'Unknown Publisher',license:'未声明',size:1048576,category:'系统',tags:['原生模块'],source:'untrusted',favorite:false,groups:[],
   perms:['native.module','account.identity'],caps:['需签名 Render Extension SPI'],deps:[],conflicts:[],
   contribution:{frameMs:0,memoryKb:0,objects:0,errors:0},changelog:'来源不可信 + 关键权限，默认拒绝。',releaseDate:'2026-06-01',supported:[],risk:'critical'}
];

const SOURCES = [
  {id:'official',name:'官方源',kind:'official',trust:'trusted',priority:0,cached:'2026-11-06 09:12',keys:['loom-official-ed25519']},
  {id:'community',name:'社区源',kind:'community',trust:'unknown',priority:10,cached:'2026-11-05 21:40',keys:['community-2026']},
  {id:'private',name:'企业/私有源',kind:'private',trust:'trusted',priority:5,cached:'2026-11-04 15:03',keys:['corp-key-1']},
  {id:'untrusted',name:'未验证镜像',kind:'community',trust:'untrusted',priority:99,cached:'2026-10-28 08:00',keys:[]}
];

const PERMS = {
  'resource.read':['低','读取本模组自带的模型、贴图和音效资源','受控 ResourceHandle，仅索引本模组命名空间'],
  'presentation.local':['低','只在你自己的屏幕上显示本地视觉效果','提交到公开 Script API，不改变多人世界权威状态'],
  'ui.screen':['低','在屏幕上显示提示文字','ScreenDisplay.setActionBar / setTitle / 模态表单'],
  'input.local':['中','感知你在游戏内的物品使用操作','订阅 world.afterEvents.itemUse 等官方事件'],
  'entity.observe.local':['中','只读查看附近实体的位置信息','Dimension.getEntities 快照，位置标 sampled'],
  'storage.world':['中','在当前存档中保存本模组数据','命名空间隔离的本地存档，服务端不可写'],
  'graphics.settings':['中','改变画面观感（天空、光照氛围）','@minecraft/server-graphics 大气散射参数，需 Vibrant Visuals'],
  'world.read.local':['中','只读查看世界空间数据','平台侧分块索引，不写世界'],
  'network.presentation':['高','连接服务器接收/发送视觉表现请求','可选 BLSP/1，断线不影响本地功能'],
  'account.identity':['关键','访问与账号身份相关的信息','默认拒绝，需单独明确可撤销同意'],
  'native.module':['关键','加载原生扩展模块（风险最高）','默认拒绝，仅签名清单 + 崩溃隔离 + 可撤销']
};

const NAV = [
  ['模组库','library','▦'],['安装与导入','install','⇩'],['源与仓库','sources','☁'],
  ['更新管理','updates','↻'],['启用与运行顺序','runtime','⏻'],['配置管理','config','⚙'],
  ['依赖与冲突','conflicts','⚠'],['权限与信任中心','permissions','⛨'],['诊断与修复','diagnostics','✚'],
  ['配置文件集','profiles','▤'],['能力矩阵与阶段合同','capability','◈']
];

const state = {
  view:'library', search:'', filters:[], sort:'name', favoriteOnly:false,
  selected:null, installStep:0, installState:'idle', installPct:0, installLog:[],
  autoUpdate:false, skipped:new Set(), enabled:new Set(MODS.filter(m=>m.state!=='disabled'&&m.state!=='blocked').map(m=>m.id)),
  safeMode:false, configLayer:'global', configSearch:'', config:{enabled:true,particle_count:1,hud_slot:'top_right',accent_color:'#59e6ff',bind:'key.g'},
  profiles:[{id:'p1',name:'探索预设',mods:['example.loom_blade','fx.particle_plus','ui.hud_suite']},{id:'p2',name:'纯净生存',mods:['builtin.core']}],
  consent:{'network.presentation':true,'graphics.settings':false}, toastTimer:null
};

const $ = (s)=>document.querySelector(s);
const esc = (s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtSize = (n)=> n>1048576 ? (n/1048576).toFixed(1)+' MiB' : (n/1024).toFixed(0)+' KiB';
const stTag = (s)=>`<span class="st ${STATES[s][1]}">${STATES[s][0]}</span>`;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.style.display='block'; clearTimeout(state.toastTimer); state.toastTimer=setTimeout(()=>t.style.display='none',2600); }
function permTag(p){ const e=PERMS[p]||['?','?','?']; const cls=e[0]==='关键'||e[0]==='高'?'risk-high':''; return `<span class="tag ${cls}" title="${esc(e[2])}">${esc(p)} · ${e[0]}</span>`; }

/* ------------------------------ 视图 ------------------------------ */
const V = {};

V.library = ()=>{
  let items = MODS.filter(m=>{
    if(state.search && !`${m.name} ${m.id} ${m.tags.join(' ')}`.toLowerCase().includes(state.search.toLowerCase())) return false;
    if(state.favoriteOnly && !m.favorite) return false;
    if(state.filters.length && !state.filters.includes(m.state)) return false;
    return true;
  });
  items.sort((a,b)=> state.sort==='size'? b.size-a.size : state.sort==='version'? b.version.localeCompare(a.version) : a.name.localeCompare(b.name,'zh'));
  const chips = Object.entries(STATES).map(([k,v])=>`<label class="tag" style="cursor:pointer"><input type="checkbox" data-action="filter" value="${k}" ${state.filters.includes(k)?'checked':''}> ${v[0]}</label>`).join('');
  return `<h1>模组库</h1><p class="sub">卡片、详情、依赖、权限、能力与实际来源。演示数据，不默认上传玩家已安装模组或游玩数据。</p>
  <div class="toolbar">
    <input type="text" placeholder="搜索名称 / ID / 标签…" value="${esc(state.search)}" data-action="search">
    <select data-action="sort"><option value="name">按名称</option><option value="version" ${state.sort==='version'?'selected':''}>按版本</option><option value="size" ${state.sort==='size'?'selected':''}>按大小</option></select>
    <label class="tag" style="cursor:pointer"><input type="checkbox" data-action="fav-only" ${state.favoriteOnly?'checked':''}> 仅收藏</label>
    <button class="btn sm" data-action="clear-filters">清除筛选</button>
  </div>
  <div class="row" style="margin-bottom:14px">${chips}</div>
  <div class="mods-grid">${items.map(m=>`
    <div class="modcard">
      <div class="thumb">截图占位 · 演示数据</div>
      <div class="body">

/* ------------------------------ 安装状态机 ------------------------------ */
let installTimer=null;
function installStart(){
  state.installState='running'; state.installPct=0; state.installLog=['INIT → PRECHECK'];
  const seq=[['PRECHECK',10,'签名 + 文件清单校验通过'],['STAGING',30,'暂存 23 个文件'],['BACKUP',50,'已备份旧版本'],['COMMIT_PENDING',70,'提交点已记录'],['COMMITTED',85,'目录 rename 完成'],['VERIFY',95,'回读校验通过'],['DONE',100,'安装完成']];
  let i=0; render();
  installTimer=setInterval(()=>{
    if(state.installState!=='running'){clearInterval(installTimer);return;}
    const s=seq[i++]; state.installPct=s[1]; state.installLog.push(`${s[0]}：${s[2]}`);
    if(s[0]==='DONE'){state.installState='done';clearInterval(installTimer);toast('原子安装完成，事务已 COMMIT');}
    render();
  },420);
}
function installCancel(){ clearInterval(installTimer); state.installState='cancelled'; state.installPct=0; state.installLog.push('E_TX_CANCELLED：用户取消，自动回滚到 BEGIN 前状态'); render(); toast('已取消并回滚'); }

/* ------------------------------ 渲染与事件 ------------------------------ */
function render(){
  $('#nav').innerHTML=NAV.map(([name,key,ico],i)=>`${i===0?'<div class="group">模组管理</div>':i===10?'<div class="group">平台证据</div>':''}<button class="${state.view===key?'active':''}" data-action="nav" data-view="${key}"><span class="ico">${ico}</span>${name}</button>`).join('');
  $('#view').innerHTML=(V[state.view]||V.library)();
  document.querySelectorAll('[data-action="sort"]').forEach(el=>{ /* value set by selected attr */ });
}

document.addEventListener('click',(e)=>{
  const el=e.target.closest('[data-action]'); if(!el) return;
  const a=el.dataset.action, id=el.dataset.id;
  switch(a){
    case 'nav': state.view=el.dataset.view; render(); break;
    case 'detail': openDrawer(id); break;
    case 'close-drawer': closeDrawer(); break;
    case 'toggle-fav': {const m=MODS.find(x=>x.id===id); m.favorite=!m.favorite; render(); toast(m.favorite?'已收藏':'已取消收藏'); break;}
    case 'filter': {const v=el.value; state.filters=el.checked?[...state.filters,v]:state.filters.filter(x=>x!==v); render(); break;}
    case 'clear-filters': state.filters=[];state.search='';state.favoriteOnly=false;render();break;
    case 'fav-only': state.favoriteOnly=el.checked;render();break;
    case 'pick-source': toast(`已选择来源：${el.dataset.kind}（演示）`);break;
    case 'install-start': installStart();break;
    case 'install-cancel': installCancel();break;
    case 'install-reset': clearInterval(installTimer);state.installState='idle';state.installPct=0;state.installLog=[];state.installStep=0;render();break;
    case 'toggle-auto': state.autoUpdate=!state.autoUpdate;render();toast(state.autoUpdate?'已开启自动更新（真实产品仍默认关闭）':'自动更新默认关闭');break;
    case 'skip': state.skipped.add(el.dataset.v);render();toast(`已跳过 ${el.dataset.v}`);break;
    case 'plan-update': toast(`${el.dataset.v}：${el.dataset.breaking==='true'?'重大更新 + 新增权限，需二次确认并更新前备份':'常规更新，更新前备份 + 冒烟测试'}`);break;
    case 'safe-mode': state.safeMode=!state.safeMode;render();toast(state.safeMode?'已进入安全模式，全部模组停用':'已退出安全模式');break;
    case 'toggle-enabled': {const s=new Set(state.enabled); s.has(id)?s.delete(id):s.add(id); state.enabled=s; render(); toast(id=== 'builtin.core'?'阻止危险禁用：3 个模组依赖它':'已切换启用状态并释放/登记资源');break;}
    case 'config-reset': state.config={enabled:true,particle_count:1,hud_slot:'top_right',accent_color:'#59e6ff',bind:'key.g'};render();toast('已恢复默认值');break;
    case 'config-export': {const text=JSON.stringify({schema:'bedrockloom.config/v1',layer:state.configLayer,values:state.config,redacted:['token']},null,2);copyText(text);break;}
    case 'config-import': toast('导入配置：展示 Schema 版本差异，冲突项不静默覆盖');break;
    case 'force-override': toast('强制覆盖已记录：风险说明 + 审计记录 + 回退点 BACKUP');break;
    case 'reconfirm': state.consent['graphics.settings']=true;toast('已明确同意 graphics.settings 并写入审计记录');break;
    case 'revoke': state.consent['network.presentation']=false;toast('已撤销 network.presentation，相关能力停止');break;
    case 'repair': toast(`执行修复：${el.dataset.what}（可撤销、长任务可取消）`);break;
    case 'copy-diag': copyText('Bedrock Loom 脱敏诊断包\n客户端 1.21.130 / international\n设备: 未验证 / 存档: 未验证 / 测试日期: 未运行（沙箱无客户端）\n错误: E_FILE_HASH_MISMATCH [mod-bug]; E_CAP_UNAVAILABLE [client-limit]\n已排除: 聊天、账号、IP、跨平台 ID、完整坐标轨迹\n遥测: 默认不收集');break;
    case 'profile-apply': toast('应用文件集：逐项启用并展示缺失模组说明');break;
    case 'profile-export': toast('导出：仅 ID/版本/配置，不默认包含模组文件');break;
    case 'profile-new': {state.profiles.push({id:'p'+(state.profiles.length+1),name:'新建预设 '+(state.profiles.length+1),mods:['builtin.core']});render();toast('已创建文件集');break;}
    case 'profile-import': toast('导入：缺失模组与版本差异逐条说明，不静默补齐');break;
    case 'profile-diff': toast('跨设备差异：缺失 1 项、版本差异 1 项');break;
    case 'detail-install': closeDrawer();state.view='install';render();break;
    case 'detail-config': closeDrawer();state.view='config';render();break;
  }
});

document.addEventListener('input',(e)=>{
  const el=e.target.closest('[data-action]'); if(!el) return;
  const a=el.dataset.action;
  if(a==='search'){state.search=el.value;render();const inp=document.querySelector('[data-action="search"]');if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}}
  else if(a==='config-search'){state.configSearch=el.value;render();const inp=document.querySelector('[data-action="config-search"]');if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}}
  else if(a==='config-set'){
    const k=el.dataset.key;
    state.config[k]= el.type==='checkbox'?el.checked : el.type==='number'?Number(el.value):el.value;
    toast(`已更新 ${k}（${state.configLayer} 层）`);
  }
});
document.addEventListener('change',(e)=>{
  const el=e.target.closest('[data-action]'); if(!el) return;
  if(el.dataset.action==='sort'){state.sort=el.value;render();}
  else if(el.dataset.action==='config-layer'){state.configLayer=el.value;render();}
});
function copyText(text){
  const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('已复制到剪贴板（脱敏）');}catch{toast('复制失败，请手动选择文本');}
  document.body.removeChild(ta);
}
render();
</script>
</body>
</html>
